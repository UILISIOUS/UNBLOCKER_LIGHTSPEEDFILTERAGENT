<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <p id="status">Decrypting and redirecting...</p>

    <script>
        const SECRET = "8Pq8tt9XOnoXVeZ0xOzookrvC03H8wGt";

        async function decryptAndRedirect() {
            const params = new URLSearchParams(window.location.search);
            const ciphertext = params.get('d');
            const ivHex = params.get('i');
            const statusCode = parseInt(params.get('s'), 10) || 301;

            if (!ciphertext || !ivHex) {
                document.getElementById('status').innerText = "Invalid Request: Missing parameters.";
                return;
            }

            try {
                const enc = new TextEncoder();
                const keyMaterial = enc.encode(SECRET.trim());
                
                const key = await crypto.subtle.importKey(
                    "raw",
                    keyMaterial,
                    "AES-GCM",
                    false,
                    ["decrypt"]
                );

                const iv = new Uint8Array(ivHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));

                const binaryString = atob(ciphertext);
                const len = binaryString.length;
                const encryptedData = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    encryptedData[i] = binaryString.charCodeAt(i);
                }

                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv },
                    key,
                    encryptedData
                );

                const targetUrl = new TextDecoder().decode(decrypted);
                window.location.replace(targetUrl);

            } catch (e) {
                document.getElementById('status').innerText = "Encryption mismatch or decryption failed.";
            }
        }

        decryptAndRedirect();
    </script>
</body>
</html>
